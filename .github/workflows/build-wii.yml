name: Build Wii

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkitppc:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup devkitPPC
        run: |
          export PATH="$DEVKITPPC/bin:$PATH"
          echo "$DEVKITPPC/bin" >> "$GITHUB_PATH"
          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITPPC=$DEVKITPPC"
          ls -la "$DEVKITPPC/bin"
          which powerpc-eabi-gcc
          powerpc-eabi-gcc --version

      - name: Build
        run: |
          export PATH="$DEVKITPPC/bin:$PATH"
          make clean || true
          make

      - name: Check DOL
        run: |
          ls -lh ransom-wii.dol
          file ransom-wii.dol

      - name: Upload DOL
        uses: actions/upload-artifact@v4
        with:
          name: ransom-wii-dol
          path: ransom-wii.dol

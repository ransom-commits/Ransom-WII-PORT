name: Build Wii

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkitppc:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup devkitPro
        shell: bash
        run: |
          set -eux

          export PATH="$DEVKITPPC/bin:$DEVKITPPC/powerpc-eabi/bin:$PATH"

          echo "$DEVKITPPC/bin" >> "$GITHUB_PATH"
          echo "$DEVKITPPC/powerpc-eabi/bin" >> "$GITHUB_PATH"

          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITPPC=$DEVKITPPC"

          command -v powerpc-eabi-gcc
          powerpc-eabi-gcc --version

          test -f "$DEVKITPPC/wii_rules"
          test -d "$DEVKITPRO/libogc"
          test -d "$DEVKITPRO/libogc/lib/wii"

      - name: Check project
        shell: bash
        run: |
          set -eux

          test -f main.c
          test -f game.c
          test -f game.h
          test -f Makefile

          echo "Project structure OK"

      - name: Build
        shell: bash
        run: |
          set -eux

          export PATH="$DEVKITPPC/bin:$DEVKITPPC/powerpc-eabi/bin:$PATH"

          make clean
          make V=1

      - name: Verify DOL
        shell: bash
        run: |
          set -eux

          test -s ransom-wii.dol

          echo "SUCCESS:"
          ls -lh ransom-wii.dol
          file ransom-wii.dol

      - name: Upload DOL
        uses: actions/upload-artifact@v4
        with:
          name: ransom-wii-dol
          path: ransom-wii.dol
          if-no-files-found: error

name: Build Wii

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkitppc:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Wii toolchain
        run: |
          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITPPC=$DEVKITPPC"
          which powerpc-eabi-gcc
          powerpc-eabi-gcc --version
          test -f "$DEVKITPPC/wii_rules"
          test -d "$DEVKITPRO/libogc"
          echo "Wii toolchain OK"

      - name: Build
        run: |
          make clean || true
          make V=1

      - name: Verify output
        run: |
          test -s ransom-wii.dol
          ls -lh ransom-wii.dol
          file ransom-wii.dol

      - name: Upload DOL
        uses: actions/upload-artifact@v4
        with:
          name: ransom-wii-dol
          path: ransom-wii.dol
          if-no-files-found: error

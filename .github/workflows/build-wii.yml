name: Build Wii

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkitppc:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check devkitPro
        shell: bash
        run: |
          set -eux

          export PATH="$DEVKITPPC/bin:$PATH"
          export PATH="$DEVKITPPC/powerpc-eabi/bin:$PATH"

          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITPPC=$DEVKITPPC"

          command -v powerpc-eabi-gcc
          powerpc-eabi-gcc --version

          test -f "$DEVKITPPC/wii_rules"
          test -f "$DEVKITPPC/base_rules"
          test -d "$DEVKITPRO/libogc"
          test -d "$DEVKITPRO/libogc/lib/wii"

          echo "devkitPro Wii toolchain OK"

      - name: Show project
        shell: bash
        run: |
          set -eux
          find . -maxdepth 3 -type f | sort

      - name: Build
        shell: bash
        run: |
          set -eux

          export PATH="$DEVKITPPC/bin:$PATH"
          export PATH="$DEVKITPPC/powerpc-eabi/bin:$PATH"

          make clean
          make V=1

      - name: Verify DOL
        shell: bash
        run: |
          set -eux

          test -f ransom-wii.dol
          test -s ransom-wii.dol

          ls -lh ransom-wii.dol
          file ransom-wii.dol

      - name: Upload DOL
        uses: actions/upload-artifact@v4
        with:
          name: ransom-wii-dol
          path: ransom-wii.dol
          if-no-files-found: error

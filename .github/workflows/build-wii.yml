name: Build Wii

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkitppc:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Wii toolchain
        run: |
          export PATH="$DEVKITPPC/bin:$PATH"
          echo "$DEVKITPPC/bin" >> "$GITHUB_PATH"

          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITPPC=$DEVKITPPC"

          "$DEVKITPPC/bin/powerpc-eabi-gcc" --version

          test -f "$DEVKITPPC/wii_rules"
          test -d "$DEVKITPRO/libogc"

          echo "Wii toolchain OK"

      - name: Build
        run: |
          export PATH="$DEVKITPPC/bin:$PATH"
          make clean || true
          make V=1

      - name: Verify DOL
        run: |
          test -s ransom-wii.dol
          ls -lh ransom-wii.dol
          file ransom-wii.dol

      - name: Upload DOL
        uses: actions/upload-artifact@v4
        with:
          name: ransom-wii-dol
          path: ransom-wii.dol
          if-no-files-found: error

name: Build Wii

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    container:
      image: devkitpro/devkitppc:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Wii toolchain
        shell: bash
        run: |
          set -eux
          export PATH="$DEVKITPPC/bin:$DEVKITPPC/powerpc-eabi/bin:$DEVKITPRO/tools/bin:$PATH"

          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITPPC=$DEVKITPPC"

          command -v powerpc-eabi-gcc
          powerpc-eabi-gcc --version

          test -d "$DEVKITPRO/libogc"
          test -d "$DEVKITPRO/libogc/include"
          test -d "$DEVKITPRO/libogc/lib/wii"

          test -x "$DEVKITPPC/bin/powerpc-eabi-gcc"
          test -x "$DEVKITPRO/tools/bin/elf2dol"

          echo "Compiler:"
          "$DEVKITPPC/bin/powerpc-eabi-gcc" --version

          echo "ELF2DOL:"
          "$DEVKITPRO/tools/bin/elf2dol" --help || true

          echo "Wii toolchain OK"

      - name: Check project files
        shell: bash
        run: |
          set -eux
          test -f main.c
          test -f game.c
          test -f game.h
          test -f Makefile
          echo "Project files:"
          ls -lah
          echo "Project structure OK"

      - name: Clean
        shell: bash
        run: |
          set -eux
          export PATH="$DEVKITPPC/bin:$DEVKITPPC/powerpc-eabi/bin:$DEVKITPRO/tools/bin:$PATH"
          make clean

      - name: Build DOL
        shell: bash
        run: |
          set -eux
          export PATH="$DEVKITPPC/bin:$DEVKITPPC/powerpc-eabi/bin:$DEVKITPRO/tools/bin:$PATH"
          echo "powerpc-eabi-gcc:"
          command -v powerpc-eabi-gcc
          echo "elf2dol:"
          command -v elf2dol
          echo "Building..."
          make V=1

      - name: Verify DOL
        shell: bash
        run: |
          set -eux
          test -s ransom-wii.elf
          test -s ransom-wii.dol
          echo "ELF:"
          ls -lh ransom-wii.elf
          echo "DOL:"
          ls -lh ransom-wii.dol
          file ransom-wii.elf || true
          file ransom-wii.dol || true
          echo "DOL successfully created."

      - name: Upload Wii DOL
        uses: actions/upload-artifact@v4
        with:
          name: ransom-wii-dol
          path: |
            ransom-wii.dol
            ransom-wii.elf
          if-no-files-found: error

      - name: Publish GitHub Release
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: wii-build-${{ github.run_number }}
          TITLE: R4NS0M Simulator Wii Build ${{ github.run_number }}
          SHA: ${{ github.sha }}
        run: |
          set -eux
          API="https://api.github.com"
          REPO="${{ github.repository }}"
          NOTES="Automated Wii build from commit $SHA. Includes the current GX graphical renderer, Wii Remote pointer controls, item rendering, timer, progress UI, success/game-over overlays, ELF, and DOL."
          RELEASE_JSON=$(python3 -c 'import json,os; print(json.dumps({"tag_name":os.environ["TAG"],"target_commitish":os.environ["SHA"],"name":os.environ["TITLE"],"body":os.environ["NOTES"],"draft":False,"prerelease":False}))')
          RELEASE=$(curl -fsSL -X POST "$API/repos/$REPO/releases" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d "$RELEASE_JSON")
          UPLOAD_URL=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["upload_url"].split("{")[0])' <<< "$RELEASE")
          for FILE in ransom-wii.dol ransom-wii.elf; do
            curl -fsSL -X POST "$UPLOAD_URL?name=$FILE" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$FILE"
          done

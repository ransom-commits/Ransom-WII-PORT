name: Build Wii

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkitppc:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure devkitPro
        shell: bash
        run: |
          set -eux

          export PATH="$DEVKITPPC/bin:$DEVKITPPC/powerpc-eabi/bin:$PATH"

          echo "$DEVKITPPC/bin" >> "$GITHUB_PATH"
          echo "$DEVKITPPC/powerpc-eabi/bin" >> "$GITHUB_PATH"

          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITPPC=$DEVKITPPC"

          command -v powerpc-eabi-gcc
          powerpc-eabi-gcc --version

          test -f "$DEVKITPPC/wii_rules"
          test -f "$DEVKITPPC/base_rules"
          test -d "$DEVKITPRO/libogc"
          test -d "$DEVKITPRO/libogc/include"
          test -d "$DEVKITPRO/libogc/lib/wii"

          echo "devkitPro Wii environment OK"

      - name: Inspect project
        shell: bash
        run: |
          set -eux

          echo "Project files:"
          find . -maxdepth 3 -type f | sort

          echo
          echo "Source files:"
          find source include -type f -print

      - name: Build
        shell: bash
        run: |
          set -eux

          export PATH="$DEVKITPPC/bin:$DEVKITPPC/powerpc-eabi/bin:$PATH"

          make clean
          make V=1

      - name: Verify DOL
        shell: bash
        run: |
          set -eux

          test -f ransom-wii.dol
          test -s ransom-wii.dol

          echo "DOL successfully built:"
          ls -lh ransom-wii.dol

          file ransom-wii.dol

      - name: Upload Wii DOL
        uses: actions/upload-artifact@v4
        with:
          name: ransom-wii-dol
          path: ransom-wii.dol
          if-no-files-found: error
